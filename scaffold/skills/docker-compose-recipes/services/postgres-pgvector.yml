# PostgreSQL 18 + pgvector 0.8.6 (Debian 13 trixie) — relational and vector database
# Tag, not digest: a digest freezes the bits and never picks up a rebuilt base. Between
# 2026-07-15 and 2026-08-02 the previously pinned digest went from 1 to 22 CRITICAL
# without the image changing at all. Reproducibility is worth less here than patches.
# Env vars: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT (default 5432)
# Application-side: derive DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
# The image ships pgvector; create the extension in an application migration with: CREATE EXTENSION IF NOT EXISTS vector;
# Scope: trusted single-user local workstation only. The loopback port supports applications running on the host.

postgres:
  image: pgvector/pgvector:0.8.6-pg18-trixie
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-app}
  ports:
    - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  volumes:
    - postgres_data:/var/lib/postgresql
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

# volumes block to merge:
# volumes:
#   postgres_data: {}
#
# Deployment restriction:
# - Do not use this image in production, on remote development hosts, or on shared CI runners.
# - For those environments, select a separately reviewed image or managed service and rerun the security gate.
# - Use a secret manager and do not publish the data-tier port.
# - Keep CREATE EXTENSION and vector indexes in reviewed application migrations.
